<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween — Saint-Loup-Lamairé</title><style>:root{--bg:#111018;--card:#1d1a28;--text:#f8f5ef;--muted:#c9c2d5;--accent:#ff9d3d;--accent2:#9b7cff;--ok:#75d69a;--line:#3a3548}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#29213d 0,#111018 42%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:16px}.hero{padding:16px 4px}.badge{display:inline-block;background:#30283f;color:#ffd39d;border:1px solid #4a3c5d;border-radius:999px;padding:6px 10px;font-size:.85rem}.hero h1{font-size:clamp(2rem,7vw,3.1rem);line-height:1;margin:12px 0 8px}.hero p,.small{color:var(--muted);line-height:1.5}.card{background:linear-gradient(145deg,var(--card),#16151e);border:1px solid var(--line);border-radius:22px;padding:19px;margin:14px 0;box-shadow:0 14px 35px #0005}.progress{height:10px;background:#302c3a;border-radius:99px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.mission{background:#2a2534;border-left:4px solid var(--accent);padding:13px 15px;border-radius:12px;line-height:1.5}.puzzle{font-size:1.06rem;line-height:1.65}.answer{width:100%;padding:14px;background:#0f0e15;border:1px solid #51495e;color:white;border-radius:12px;font-size:1.05rem;margin-top:8px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.btn{border:0;border-radius:12px;padding:13px;font-weight:700;cursor:pointer;background:#332d42;color:white;text-decoration:none;display:inline-block;text-align:center}.primary{background:linear-gradient(135deg,#ff9d3d,#b66cff);color:#18131e}.feedback{margin-top:10px;padding:11px 13px;border-radius:12px}.ok{background:#173523;color:#bdf1cc}.no{background:#3c1d22;color:#ffc0c0}.hint{display:none;background:#241f2e;border:1px solid #51465f;padding:12px;border-radius:12px;margin-top:10px}.hint.show{display:block}.token{display:inline-block;padding:7px 10px;border-radius:10px;background:#342a47;border:1px solid #5b4a72;margin:3px;color:#ffd39d}.map{color:#ffd19c}.teamgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.teamgrid a{color:white;text-decoration:none;background:#211e2b;border:1px solid var(--line);padding:15px;border-radius:15px}.footer{text-align:center;color:#9d96aa;padding:20px}.hidden{display:none}@media(max-width:520px){.btns,.teamgrid{grid-template-columns:1fr}}</style></head><body><main class="wrap" id="app"></main><script>const A=[{place:`Grande Place — Auberge Sainte Catherine`,title:`🧙 La première lettre`,story:`Boudibou arrive sur la Grande Place. Son grimoire refuse de reconnaître le nom de l’auberge tant qu’un vrai témoin humain ne l’a pas lu sur place.`,mission:`Devant l’Auberge Sainte Catherine, regarde l’enseigne depuis l’espace public.`,puzzle:`Quel est le dernier mot visible sur l’enseigne « Auberge Sainte … » ?`,answer:`CATHERINE`,hints:[`Le grimoire accepte enfin le nom. Une petite étincelle indique la vieille maison à pans de bois.`],transition:[`Regarde l’enseigne, pas une carte en ligne.`,`Le mot commence par C.`,`C’est CATHERINE.`]},
{place:`La Sénéchaussée`,title:`🪵 Les étages du juge`,story:`La page suivante s’est coincée sur la maison à pans de bois. Boudibou affirme que les poutres forment trois étages bien distincts.`,mission:`Place-toi face à la Sénéchaussée, à l’entrée de la rue des Trois Rois. Reste dans la rue.`,puzzle:`En regardant toute la façade depuis le rez-de-chaussée jusqu’au sommet, combien de niveaux distingues-tu ?`,answer:`3`,hints:[`Trois niveaux ! La page se libère. Une marque d’eau apparaît dans le grimoire et vous envoie vers la Place des Poulies.`],transition:[`Compte le rez-de-chaussée puis les deux niveaux au-dessus.`,`Ne compte pas le toit comme un niveau.`,`La réponse est 3.`]},
{place:`Place des Poulies`,title:`🌊 La marque de l’eau`,story:`Le grimoire a gardé la mémoire d’une grande crue. Il veut que vous retrouviez une année directement sur le mur des repères de crues.`,mission:`Rejoins le mur portant les repères de crues sur la Place des Poulies.`,puzzle:`Quelle année est indiquée sur le repère de crue correspondant à la grande crue évoquée par le grimoire ?`,answer:`1961`,hints:[`1961 ! La page claque comme une petite porte magique. Les trois rois vous appellent maintenant dans leur rue.`],transition:[`Cherche les repères de hauteur sur le mur.`,`Repère l’année la plus clairement associée à la grande crue du siècle.`,`La réponse est 1961.`]},
{place:`Rue des Trois Rois`,title:`👑 Les mots des rois`,story:`Trois rois veulent savoir si vous êtes vraiment dans leur rue. Ils ont caché leur nombre dans la plaque de rue.`,mission:`Trouve la plaque « Rue des Trois Rois » et lis-la directement.`,puzzle:`Combien de mots sont écrits sur la plaque ?`,answer:`4`,hints:[`Quatre mots ! Les rois sont satisfaits. La page suivante pointe vers le grand clocher.`],transition:[`Lis toute la plaque.`,`Compte RUE, DES, TROIS et ROIS.`,`La réponse est 4.`]},
{place:`Église Notre-Dame de l’Assomption`,title:`⛪ Les arches du clocher`,story:`Boudibou entend les cloches mais le sort veut une observation précise. La réponse doit venir de ce que vos yeux voient, pas d’une recherche.`,mission:`Place-toi devant l’église et regarde la partie du clocher avec les grandes ouvertures en arc.`,puzzle:`Sur la face du clocher que tu regardes, combien de grandes ouvertures en arc sont visibles ?`,answer:`4`,hints:[`Quatre arches ! Le grimoire se remet à chanter. Une dernière vérification vous ramène sur la Grande Place.`],transition:[`Compte uniquement les grandes ouvertures en arc du niveau du clocher.`,`Ne compte pas les petites ouvertures de la flèche.`,`La réponse attendue est 4.`]},
{place:`Grande Place — Auberge Sainte Catherine`,title:`🪧 Le nom en lettres`,story:`Gaston aurait écrit « SAINTE CATHERINE » dans le grimoire de Boudibou. Mais seule l’observation de l’enseigne compte.`,mission:`Reviens devant l’Auberge Sainte Catherine.`,puzzle:`Compte les lettres du mot CATHERINE visible sur l’enseigne.`,answer:`9`,hints:[`Neuf lettres ! Vous avez assez de fragments pour reconstruire la formule sur la Grande Place.`],transition:[`Lis CATHERINE sur place.`,`C-A-T-H-E-R-I-N-E.`,`Il y a 9 lettres.`]},
{place:`Grande Place — méta`,title:`🧩 Le code des fragments`,story:`Les six observations sont enfin réunies. Boudibou ne veut pas les additionner : il veut garder le dernier chiffre de chaque réponse numérique des étapes 2 à 6.`,mission:`Restez sur la Grande Place et reprenez vos réponses.`,puzzle:`Prenez le dernier chiffre de 3, 1961, 4, 4 et 9, dans cet ordre. Quel code obtenez-vous ?`,answer:`31449`,hints:[`Le code 31449 ouvre la dernière page. Il ne manque plus que la formule finale !`],transition:[`Étape 2 → 3.`,`Étapes 3 à 6 → 1, 4, 4, 9.`,`Le code est 31449.`]},
{place:`Grande Place — final`,title:`🎃 La formule de Boudibou`,story:`Boudibou rassemble les fragments et sourit : le grimoire a retrouvé son ordre. La formule finale doit commencer par le mot-clé de la sorcière puis le code du méta-puzzle.`,mission:`Réunissez toute l’équipe sur la Grande Place et tapez la formule finale.`,puzzle:`Écrivez BOUGIE suivi immédiatement du code méta de l’étape 7.`,answer:`BOUGIE31449`,hints:[`✨ Le chaudron fait « blop ! ». Les lanternes s’allument : mission accomplie !`],transition:[`Le mot-clé est BOUGIE.`,`Ajoute 31449 sans espace.`,`La formule finale est BOUGIE31449.`]}];const B=[{place:`Église Notre-Dame de l’Assomption`,title:`👻 Les arches de Gaston`,story:`Gaston a laissé une page près du clocher. Il prétend que seules les grandes arches visibles peuvent lui dire si vous êtes bien arrivés.`,mission:`Place-toi devant l’église et observe le niveau du clocher avec les grandes ouvertures en arc.`,puzzle:`Combien de grandes ouvertures en arc vois-tu sur la face du clocher tournée vers toi ?`,answer:`4`,hints:[`Gaston applaudit sans faire de bruit. Sa page indique maintenant la Place des Poulies.`],transition:[`Compte les grandes ouvertures en arc.`,`Ignore les petites ouvertures plus haut.`,`La réponse est 4.`]},
{place:`Place des Poulies`,title:`🌊 Le souvenir de 1961`,story:`Le carnet de Gaston adore les vieux repères. Une année gravée sur le mur des crues lui rappelle une histoire qu’il ne veut pas oublier.`,mission:`Trouve le mur des repères de crues sur la Place des Poulies.`,puzzle:`Quelle année lis-tu sur le repère de la grande crue de 1961 ?`,answer:`1961`,hints:[`Le souvenir est retrouvé. Gaston vous envoie vers la maison à pans de bois.`],transition:[`Cherche les marques de hauteur.`,`Repère l’année 1961 directement sur le mur.`,`Tape seulement 1961.`]},
{place:`La Sénéchaussée`,title:`🪵 Trois niveaux`,story:`Gaston prétend qu’il peut compter les étages sans monter une seule marche.`,mission:`Place-toi face à la Sénéchaussée depuis la rue.`,puzzle:`Combien de niveaux de façade distingues-tu du rez-de-chaussée au sommet, sans compter le toit ?`,answer:`3`,hints:[`Trois ! Gaston fait un petit tour de magie et la plaque des Trois Rois apparaît dans son carnet.`],transition:[`Compte le rez-de-chaussée.`,`Ajoute les deux niveaux supérieurs.`,`Réponse : 3.`]},
{place:`Rue des Trois Rois`,title:`👑 La plaque des trois rois`,story:`Gaston est persuadé que le nom de la rue cache quatre petits mots. Vérifiez-le avec vos propres yeux.`,mission:`Trouve la plaque de rue.`,puzzle:`Combien de mots sont écrits sur « Rue des Trois Rois » ?`,answer:`4`,hints:[`Quatre mots ! Gaston vous fait signe de revenir vers la Grande Place.`],transition:[`RUE = 1.`,`DES = 2, TROIS = 3, ROIS = 4.`,`Réponse : 4.`]},
{place:`Grande Place — Auberge Sainte Catherine`,title:`🎀 Le ruban de Catherine`,story:`Sur l’enseigne de l’auberge, Gaston cherche le nom CATHERINE. Son carnet veut savoir combien de lettres il contient.`,mission:`Regarde l’enseigne de l’Auberge Sainte Catherine.`,puzzle:`Combien de lettres compte le mot CATHERINE ?`,answer:`9`,hints:[`Neuf ! Le carnet commence à ressembler à une vraie clé. Direction la Place des Poulies pour une dernière observation.`],transition:[`C-A-T-H-E-R-I-N-E.`,`Compte chaque lettre une seule fois.`,`Réponse : 9.`]},
{place:`Place des Poulies`,title:`🪢 Les lettres des Poulies`,story:`Gaston a oublié combien de lettres possède le nom de la place. Cette fois, c’est à vous de le lire sur place.`,mission:`Regarde le nom « POULIES » sur la signalétique de la place.`,puzzle:`Combien de lettres contient POULIES ?`,answer:`7`,hints:[`Sept ! Gaston a maintenant tous ses souvenirs. Retour à la Grande Place pour les assembler.`],transition:[`P-O-U-L-I-E-S.`,`Compte les sept lettres.`,`Réponse : 7.`]},
{place:`Grande Place — méta`,title:`🧩 Le carnet à rebours`,story:`Gaston a noté les réponses numériques des étapes 1 à 6. Pour le code, il veut seulement leur dernier chiffre, dans l’ordre.`,mission:`Restez sur la Grande Place et reprenez les réponses des six étapes.`,puzzle:`Prenez le dernier chiffre de 4, 1961, 3, 4, 9 et 7. Quel code obtenez-vous ?`,answer:`413497`,hints:[`Le coffre se met à trembler. Gaston a retrouvé son code, mais il faut encore le mot final.`],transition:[`Étapes 1 à 6 : 4 / 1961 / 3 / 4 / 9 / 7.`,`Gardez seulement le dernier chiffre de chacune.`,`Le code est 413497.`]},
{place:`Grande Place — final`,title:`🍬 Le trésor de Gaston`,story:`Le fantôme vous tend son dernier billet : le code est bon, mais le coffre veut aussi le nom du parcours secret.`,mission:`Restez tous ensemble sur la Grande Place et tapez le mot de passe.`,puzzle:`Écrivez GASTON suivi immédiatement du code méta de l’étape 7.`,answer:`GASTON413497`,hints:[`🍬 Clic ! Le coffre s’ouvre. Gaston distribue des bonbons imaginaires et vous félicite !`],transition:[`Le mot commence par GASTON.`,`Ajoute 413497 sans espace.`,`Le mot de passe est GASTON413497.`]}];const TEAMS={a1:{r:'A',t:'14h00'},a2:{r:'A',t:'14h15'},b1:{r:'B',t:'14h00'},b2:{r:'B',t:'14h15'}};function n(v){return String(v).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'')}function data(k){return TEAMS[k].r==='A'?A:B}function key(k){return 'sll-halloween-v2-'+k}function load(k){try{return JSON.parse(localStorage.getItem(key(k)))||{i:0,j:3,t:[],h:{}}}catch{return{i:0,j:3,t:[],h:{}}}}function save(k,s){localStorage.setItem(key(k),JSON.stringify(s))}function map(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q+', Saint-Loup-Lamairé, France')}function reset(k){localStorage.removeItem(key(k));render()}function home(){app.innerHTML=`<section class="hero"><span class="badge">🎃 HALLOWEEN • SAINT-LOUP-LAMAIRÉ</span><h1>La grande quête</h1><p>Deux aventures familiales de 8 étapes. Les réponses des étapes de terrain se trouvent en observant réellement les lieux. Pas de GPS, pas de cachette à fouiller.</p></section><div class="card"><h2>Choisis ton équipe</h2><div class="teamgrid">${Object.entries(TEAMS).map(([k,v])=>`<a href="#/equipe/${k}"><b>Équipe ${k.toUpperCase()}</b><br><span class="small">Parcours ${v.r} • départ ${v.t}</span></a>`).join('')}</div></div><div class="card"><b>⚠️ Sécurité</b><p class="small">Restez dans les espaces publics, respectez habitants et propriétés privées, ne déplacez rien et faites attention à la circulation.</p></div>`}function finish(k){let s=load(k),r=data(k);app.innerHTML=`<section class="hero"><span class="badge">🏆 MISSION ACCOMPLIE</span><h1>${TEAMS[k].r==='A'?'Boudibou':'Gaston'} vous félicite !</h1></section><div class="card"><h2>${r.at(-1).transition}</h2><p class="small">Équipe ${k.toUpperCase()} • ${TEAMS[k].r}</p><button class="btn" onclick="if(confirm('Effacer la progression ?'))reset('${k}')">Rejouer</button></div>`}function renderTeam(k){if(!TEAMS[k])return home();let s=load(k),r=data(k);if(s.i>=r.length)return finish(k);let x=r[s.i],pct=Math.round(s.i/r.length*100),used=s.h[s.i]||0;app.innerHTML=`<section class="hero"><span class="badge">${TEAMS[k].r==='A'?'🧙':'👻'} ÉQUIPE ${k.toUpperCase()} • PARCOURS ${TEAMS[k].r}</span><h1>${TEAMS[k].r==='A'?'Le Grimoire de Boudibou':'Le Trésor du fantôme Gaston'}</h1><p>Étape ${s.i+1} sur ${r.length} • ${TEAMS[k].t}</p><div class="progress"><i style="width:${pct}%"></i></div></section><div class="card"><h2>${x.place}</h2><a class="map" target="_blank" href="${map(x.place)}">📍 Ouvrir la carte</a></div><div class="card"><h2>${x.title}</h2><p>${x.story}</p><div class="mission"><b>🎯 Mission</b><br>${x.mission}</div><h3>🧩 Énigme</h3><div class="puzzle">${x.puzzle}</div><input id="ans" class="answer" placeholder="Votre réponse…" autocomplete="off" onkeydown="if(event.key==='Enter')check('${k}')"><div class="btns"><button class="btn primary" onclick="check('${k}')">Valider</button><button class="btn" onclick="hint('${k}')">🃏 Joker (${s.j})</button></div><div id="fb"></div>${x.hints.map((_,i)=>`<div id="h${i}" class="hint ${i<used?'show':''}">🃏 Indice ${i+1} : ${i<used?x.hints[i]:''}</div>`).join('')}</div><div class="card"><b>Fragments</b><div>${s.t.map(t=>`<span class="token">${t}</span>`).join('')||'<span class="small">Aucun pour le moment.</span>'}</div></div><div class="card"><span class="small">Après la réussite :</span><br>${x.transition}</div><div class="footer"><button class="btn" onclick="if(confirm('Réinitialiser cette équipe ?'))reset('${k}')">Réinitialiser</button></div>`}function check(k){let s=load(k),r=data(k),x=r[s.i],v=n(ans.value),ok=v===n(x.answer);fb.className=ok?'feedback ok':'feedback no';fb.textContent=ok?'✅ Bonne réponse !':'❌ Pas encore. Observez bien le lieu et relisez la mission.';if(ok){if(!s.t.includes(x.answer))s.t.push(x.answer);s.i++;save(k,s);setTimeout(()=>render(),500)}}function hint(k){let s=load(k),r=data(k),x=r[s.i],u=s.h[s.i]||0;if(s.j<=0)return alert('Plus de joker.');if(u>=x.hints.length)return alert('Tous les indices sont déjà ouverts.');s.j--;s.h[s.i]=u+1;save(k,s);renderTeam(k)}function organizer(){app.innerHTML=`<section class="hero"><span class="badge">👩‍💼 ORGANISATEUR</span><h1>Réponses</h1></section>${Object.entries(TEAMS).map(([k,v])=>{let r=data(k);return `<div class="card"><h2>Équipe ${k.toUpperCase()}</h2><p class="small">${r.map((x,i)=>`<b>${i+1}.</b> ${x.answer}`).join(' • ')}</p><button class="btn" onclick="reset('${k}')">Réinitialiser</button></div>`}).join('')}<div class="footer"><a class="btn" href="#/">Accueil</a></div>`}function render(){let p=location.hash.replace(/^#\//,'');if(p.startsWith('equipe/'))return renderTeam(p.split('/')[1]);if(p==='organisateur')return organizer();home()}addEventListener('hashchange',render);render();</script></body></html>
